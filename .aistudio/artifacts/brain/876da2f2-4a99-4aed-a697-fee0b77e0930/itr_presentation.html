    function downloadBase64(base64Data, fileName, mimeType) {
      const byteCharacters = atob(base64Data);
      const byteNumbers = new Array(byteCharacters.length);
      for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
      }
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    let currentSlide = 0;

    function renderSlide(index) {
      if (index < 0 || index >= slides.length) return;
      currentSlide = index;
      const slide = slides[currentSlide];

      const viewport = document.getElementById('slide-content');
      viewport.innerHTML = slide.render();

      document.getElementById('current-slide-num').textContent = currentSlide + 1;
      document.getElementById('total-slides-num').textContent = slides.length;

      // Update dots
      const dotsContainer = document.getElementById('slide-dots');
      dotsContainer.innerHTML = '';
      slides.forEach((s, idx) => {
        const dot = document.createElement('button');
        dot.className = `w-2 h-2 rounded-full transition ${idx === currentSlide ? 'bg-blue-500 w-5' : 'bg-slate-700 hover:bg-slate-500'}`;
        dot.title = `Slide ${idx + 1}: ${s.title}`;
        dot.onclick = () => renderSlide(idx);
        dotsContainer.appendChild(dot);
      });

      // Update thumbnails
      const thumbs = document.querySelectorAll('.thumb-btn');
      thumbs.forEach((tb, idx) => {
        if (idx === currentSlide) {
          tb.classList.add('ring-2', 'ring-blue-500', 'bg-slate-800');
        } else {
          tb.classList.remove('ring-2', 'ring-blue-500', 'bg-slate-800');
        }
      });
    }

    function prevSlide() {
      if (currentSlide > 0) renderSlide(currentSlide - 1);
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) renderSlide(currentSlide + 1);
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') nextSlide();
    });

    // Build thumbnails
    const thumbStrip = document.getElementById('thumbnail-strip');
    slides.forEach((s, idx) => {
      const btn = document.createElement('button');
      btn.className = 'thumb-btn px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-[11px] text-slate-300 shrink-0 text-left hover:border-slate-700 transition cursor-pointer';
      btn.innerHTML = `<span class="text-blue-400 font-bold">${idx + 1}.</span> ${s.title}`;
      btn.onclick = () => renderSlide(idx);
      thumbStrip.appendChild(btn);
    });

    // Initial render
    renderSlide(0);
  </script>
